<!DOCTYPE html>
<html>

<head>
    <title>Pico Code Editor</title>
    <!-- Paho MQTT client for browsers -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.1.0/paho-mqtt.min.js"></script>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Web Commander</h1>

    <div id="status" class="disconnected">Disconnected from broker</div>
    <div class="spacer"></div>
    
    <label for="name-input">Pico Name:</label>
    <input type="text" id="name-input">
    <div class="spacer"></div>
    
    <h2>Code</h2>
    <textarea id="code" placeholder="Type your MicroPython code here...">
# Example: blink the onboard LED
from machine import Pin
from time import sleep

led = Pin('LED', Pin.OUT)
for _ in range(5):
    led.on()
    sleep(0.5)
    led.off()
    sleep(0.5)
</textarea>

    <div class="spacer-half"></div>
    <button id="send-btn" disabled onclick="sendCode()">Send to Pico</button>
    <div class="spacer"></div>

    <h2>Log</h2>
    <div id="log"></div>
    <div class="spacer-half"></div>
    <button onclick="clearLog()">Clear Log</button>


</body>

</html>
